# Dependabot: opens weekly update PRs. Patch/minor are grouped; majors land in their own PR. Every
# update type auto-merges once CI is green, except a pre-release target or a github-actions bump,
# which the `auto-merge` job in ci.yml holds for a human.
# Deliberately-held majors are ignored so they don't reopen every week (Dependabot applies
# `ignore` retroactively and auto-closes any offending open PR).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Skopje"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # vitest and its coverage provider peer each other at an EXACT version -- @vitest/coverage-v8
      # requests `vitest: "5.0.0"`, not a range -- so they have to move in the same PR on every
      # release, majors included. Listed FIRST, because a dependency joins the first group it
      # matches, and with NO update-types filter, because that is what makes a group take every
      # type. minor-and-patch alone left the major path ungrouped, which is the case that splits
      # them.
      #
      # What a split costs, measured here on 2026-09-07 rather than assumed: PRs #54 and #55 each
      # paired v5 of one package with v4 of the other. Yarn reports the unmet exact peer as a
      # YN0060 WARNING, so the install exits 0 and lint, test and build all pass -- then coverage
      # collection dies inside takeCoverage and every file reports 0%, failing the thresholds.
      # The failure surfaces as a coverage error, which reads like a test problem rather than a
      # dependency one.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node tracks the RUNTIME major, always -- typings for a Node the project does
      # not run describe APIs that are not there. Every runtime pin here says 26, so hold the
      # types at 26 until the next LTS (28) and lift both together.
      # lift-when: eol-lts nodejs 28
      - dependency-name: "@types/node"
        versions: [">=27"]
      # TypeScript 7 (native compiler) is not yet supported by typescript-eslint (peer-capped
      # <6.1.0) and breaks Yarn's TS compat patch — held until the toolchain catches up.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
        # lift-when: npm-peer typescript-eslint allows typescript >=7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Skopje"
    commit-message:
      prefix: "ci"
