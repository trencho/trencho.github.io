name: CI

# Pull-request gate: type-check + build + tests on every PR. Runs without the VITE_* secrets
# (the build/prerender only warn on missing config in Node — they hard-error solely at the
# production browser runtime), so it is a valid check for Dependabot PRs too. Pushes to master
# are already built and deployed by deploy.yml, so this stays PR-only to avoid double builds.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per PR. A superseded run's verdict is never the one that gates the merge,
# so cancelling it frees the runner instead of racing the newer push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install Dependencies
        run: yarn install --immutable

      # Runs before the tests so a style failure is reported in seconds rather than after a
      # full test + build cycle. The repo has always carried a `lint` script and an ESLint
      # config; until now nothing ran them, so the rules were advisory in practice.
      - name: Lint
        run: yarn lint

      - name: Run Tests
        run: yarn test

      - name: Build Project
        run: yarn build
