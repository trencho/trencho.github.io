# Scheduled supply-chain scan (OSV-Scanner) — reads yarn.lock and reports known advisories to
# the Security tab. Decoupled from the build/deploy gate on purpose: a newly-published advisory
# surfaces here without blocking a merge or a deploy.
name: Security scan

on:
  schedule:
    - cron: "57 7 * * 1" # weekly, Monday 07:57 UTC - fleet slot (minutes staggered per repo)
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# Every other scan in the fleet has this and this one did not, so a second push to the same ref
# queued a whole extra scan instead of superseding the first. Grouped by ref and cancelling, which
# is the shape the siblings use.
#
# Safe here despite the SARIF upload: the group is per-ref, so the run that survives is the LATER
# one on that ref, and it uploads the newer result. A cancelled run uploads nothing, which is
# correct -- its result is already stale.
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1"
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.1"
    permissions:
      actions: read
      contents: read
      security-events: write
