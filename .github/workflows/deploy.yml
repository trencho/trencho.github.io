name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  # An auto-merged Dependabot PR reaches master as a push made with GITHUB_TOKEN, and GitHub
  # raises no workflow events for its own token -- so the `push` trigger above never fires for
  # one. dependabot-auto-merge.yml dispatches this workflow itself after it merges, which needs
  # this trigger to exist. Remove it and every auto-merged bump stops reaching the live site,
  # silently: the PR still reads merged and green.
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue, they do NOT cancel. cancel-in-progress here would interrupt a
# half-published Pages commit and leave the live site on a partial tree.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install Dependencies
        run: yarn install --immutable

      # ci.yml is pull_request-only, so before this step a DIRECT push to master reached
      # production without ever being linted -- the gate existed, but not on the path that
      # actually ships. Accepted cost, decided deliberately: a lint failure now blocks the
      # deploy. Ordered before the tests so a style failure reports in seconds.
      - name: Lint
        run: yarn lint

      - name: Run Tests
        run: yarn test

      - name: Build Project
        run: yarn build
        env:
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./dist
