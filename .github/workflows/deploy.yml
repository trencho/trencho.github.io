name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  # An auto-merged Dependabot PR reaches master as a push made with GITHUB_TOKEN, and GitHub
  # raises no workflow events for its own token -- so the `push` trigger above never fires for
  # one. The `auto-merge` job in ci.yml dispatches this workflow itself after it merges, which
  # needs this trigger to exist. Remove it and every auto-merged bump stops reaching the live site,
  # silently: the PR still reads merged and green.
  workflow_dispatch:

# pull-requests and actions: read let the `tested` step look up the pull request and the jobs of
# its ci.yml runs. Without them those calls 403 and the step falls back to running the tests.
permissions:
  contents: read
  pull-requests: read
  actions: read

# Deploys queue, they do NOT cancel. cancel-in-progress here would interrupt a
# half-published Pages commit and leave the live site on a partial tree.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install Dependencies
        run: yarn install --immutable

      # A merged pull request was already linted and tested by ci.yml, on a head whose tree is
      # what this run would deploy. Re-running both here only repeats that result. This step
      # skips them when, and only when, this commit is a PR's merge commit, the PR head has the
      # identical tree, and the `build` job passed in a ci.yml pull_request run on that head. It
      # checks the job, not the whole run: auto-merge dispatches this workflow from inside the PR
      # run, before that run concludes. JOB_NAME is ci.yml's job name as the jobs API reports it;
      # rename that job and this finds nothing and runs the checks. Only a push or the auto-merge
      # job's dispatch (GITHUB_TOKEN, so github-actions[bot]) can skip. A manual dispatch always
      # runs the checks, and is the way to get an extra shuffle seed. A PR merged while behind
      # master gets a different tree, so it is tested again. Any other case runs them, and so does
      # any API failure: a direct push, a failed, cancelled or missing `build` job. The owner
      # accepted that a skipped merge no longer tries a second shuffle seed.
      - name: Check whether ci.yml already tested this tree
        id: tested
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.triggering_actor == 'github-actions[bot]')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          JOB_NAME: build
        run: |
          tested=false
          reason="no merged pull request has this commit as its merge commit"
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0] // empty | \"\(.number) \(.head.sha)\"") ||
            { pr=""; reason="the pull request lookup failed"; }
          if [ -n "$pr" ]; then
            num=${pr%% *}
            head=${pr##* }
            merged_tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || merged_tree=""
            head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) || head_tree=""
            if [ -z "$merged_tree" ] || [ "$merged_tree" != "$head_tree" ]; then
              reason="#$num's head tree differs from the merged tree"
            else
              if ! runs=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100" \
                --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml") | .id'); then
                reason="the CI run lookup for #$num's head ${head:0:7} failed"
              else
                reason="no successful '$JOB_NAME' job on #$num's head ${head:0:7}"
                for id in $runs; do
                  count=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
                    --jq "[.jobs[] | select(.name == \"$JOB_NAME\" and .conclusion == \"success\")] | length") ||
                    { reason="the job lookup for ci.yml run $id failed"; continue; }
                  case "$count" in
                    '' | *[!0-9]*) reason="the job lookup for ci.yml run $id returned '$count'" ;;
                    0) ;;
                    *)
                      tested=true
                      reason="#$num's head ${head:0:7} has the same tree and its '$JOB_NAME' job passed in ci.yml run $id"
                      break
                      ;;
                  esac
                done
              fi
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          if [ "$tested" = true ]; then verdict="Lint and tests skipped"; else verdict="Lint and tests run"; fi
          echo "$verdict: $reason"
          echo "$verdict: $reason" >> "$GITHUB_STEP_SUMMARY"

      # ci.yml is pull_request-only, so before this step a DIRECT push to master reached
      # production without ever being linted -- the gate existed, but not on the path that
      # actually ships. Accepted cost, decided deliberately: a lint failure now blocks the
      # deploy. Ordered before the tests so a style failure reports in seconds.
      - name: Lint
        if: steps.tested.outputs.tested != 'true'
        run: yarn lint

      # The same gate as ci.yml's Run Tests: coverage floors, shuffled, seeded by the run id.
      # `yarn test --sequence.shuffle --sequence.seed=<seed>` reproduces an order failure locally.
      - name: Run Tests
        if: steps.tested.outputs.tested != 'true'
        env:
          SEED: ${{ github.run_id }}
        run: |
          echo "Shuffled test order, seed $SEED"
          echo "Shuffled test order, seed \`$SEED\`" >> "$GITHUB_STEP_SUMMARY"
          yarn coverage --sequence.shuffle "--sequence.seed=$SEED"

      - name: Build Project
        run: yarn build
        env:
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./dist
